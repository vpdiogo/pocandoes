name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:coming-soon
      - run: docker compose -f compose.coming-soon.yaml config --quiet
      - run: docker compose -f compose.coming-soon.yaml build
      - run: docker compose -f compose.coming-soon.yaml run --rm --no-deps coming-soon caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  collectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - run: pip install ./collectors
      - run: pocandoes-collector
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
